name: Sync upstream
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Add upstream
        run: git remote add upstream https://github.com/heygen-com/hyperframes.git || true
      - name: Fetch upstream
        run: git fetch upstream
      - name: Merge upstream
        run: git merge upstream/HEAD --no-edit -X ours || git merge FETCH_HEAD --no-edit -X ours || true
      - name: Resolve conflicts
        run: |
          git diff --name-only --diff-filter=U | while read f; do
            case "$f" in
              .github/workflows/sync-upstream.yml) ;;
              .github/workflows/*) git rm -f "$f" ;;
              *) git checkout --ours -- "$f" ;;
            esac
          done
      - name: Preserve fork workflow
        run: |
          mkdir -p .github/workflows
          find .github/workflows -type f ! -name "sync-upstream.yml" -delete
          git add -f .github/workflows
          git commit -m "chore: preserve fork sync workflow" --allow-empty
      - name: Push
        run: git push