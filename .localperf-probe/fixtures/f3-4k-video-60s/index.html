<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #bg { position: absolute; inset: 0; width: 3840px; height: 2160px; object-fit: cover; }
    #pip { position: absolute; right: 160px; bottom: 160px; width: 1280px; height: 720px; border: 12px solid #fff; border-radius: 32px; }
    #title { position: absolute; left: 200px; top: 200px; font-size: 220px; color: #fff; font-weight: 800; text-shadow: 0 8px 40px rgba(0,0,0,.6); }
    #bar { position: absolute; left: 200px; top: 500px; height: 24px; width: 0; background: #ffcc00; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="f3" data-start="0" data-duration="60" data-width="3840" data-height="2160" data-fps="30">
    <video id="bg" src="assets/bg.mp4" data-start="0" data-duration="60" data-track-index="0" muted></video>
    <video id="pip" src="assets/pip.mp4" data-start="5" data-duration="50" data-track-index="1" muted></video>
    <h1 id="title" data-start="0" data-duration="60" data-track-index="2">Floor table 4K</h1>
    <div id="bar" data-start="0" data-duration="60" data-track-index="3"></div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bg", { scale: 1.08 }, { scale: 1, duration: 60, ease: "none" }, 0);
      tl.fromTo("#pip", { x: 1600, opacity: 0 }, { x: 0, opacity: 1, duration: 1.5, ease: "power3.out" }, 5);
      tl.fromTo("#title", { y: -80, opacity: 0 }, { y: 0, opacity: 1, duration: 1.2 }, 0.5);
      tl.to("#bar", { width: 3440, duration: 58, ease: "none" }, 1);
      tl.to("#pip", { x: 1600, opacity: 0, duration: 1.5, ease: "power3.in" }, 53.5);
      window.__timelines["f3"] = tl;
    </script>
  </div>
</body>
</html>
